version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: formation_hub_postgres
    environment:
      POSTGRES_DB: formation_hub
      POSTGRES_USER: formation_user
      POSTGRES_PASSWORD: formation_password
      TZ: 'UTC'
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - formation_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formation_user -d formation_hub"]
      timeout: 20s
      retries: 10

  # PostgREST API
  postgrest:
    image: postgrest/postgrest:latest
    container_name: formation_hub_postgrest
    environment:
      PGRST_DB_URI: postgres://formation_user:formation_password@postgres:5432/formation_hub
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: your-super-secret-key-change-this-in-production-at-least-32-characters-long
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3001
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - formation_network

  # Backend Spring Boot (sera construit et lancé localement)
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: formation_hub_backend
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/formation_hub
  #     SPRING_DATASOURCE_USERNAME: formation_user
  #     SPRING_DATASOURCE_PASSWORD: formation_password
  #     JWT_SECRET: your-super-secret-key-change-this-in-production
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - formation_network

  # Frontend React (optionnel - sera lancé avec npm run dev)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: formation_hub_frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     VITE_API_URL: http://localhost:8080/api
  #   depends_on:
  #     - backend
  #   networks:
  #     - formation_network

volumes:
  postgres_data:
    driver: local

networks:
  formation_network:
    driver: bridge
