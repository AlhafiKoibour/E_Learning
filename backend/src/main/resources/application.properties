# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Info
spring.application.name=ToumaiHub
app.version=1.0.0

# Allow circular references
spring.main.allow-circular-references=true

# Disable devtools restart
spring.devtools.restart.enabled=false

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/formation_hub
spring.datasource.username=postgres
spring.datasource.password=evrad
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 Console (disabled for PostgreSQL)
spring.h2.console.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.formationhub=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=your-super-secret-key-change-this-in-production-at-least-32-characters-long
jwt.expiration=86400000
jwt.refreshExpiration=604800000

# CORS Configuration
cors.allowedOrigins=http://localhost:3000,http://localhost:5173,http://localhost:3001
cors.allowedMethods=GET,POST,PUT,DELETE,OPTIONS
cors.allowedHeaders=*
cors.allowCredentials=true

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=./uploads

# Email Configuration (Optional)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true

# Cache Configuration
spring.cache.type=simple

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.locale=fr_FR
